name: Refresh live forecast

# Re-fetches the latest ONS monthly mortality data and re-executes notebooks
# 01 (headline counterfactual) and 07 (live forecast) so the rendered
# figures and tables stay current. ONS publishes a new monthly edition
# mid-month; the schedule fires at 02:00 UTC on the 25th to give the
# upload pipeline time to settle.

on:
  schedule:
    - cron: "0 2 25 * *"
  workflow_dispatch:
    # Manual trigger for testing or one-off refreshes.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert ipykernel
          pip install -e .

      - name: Fetch latest ONS monthly mortality data
        run: |
          ons-mortality fetch \
            --start-year 2006 \
            --end-year $(date +%Y)

      - name: Fetch latest ONS weekly age-band data
        run: |
          ons-mortality fetch-weekly-ages \
            --start-year 2010 \
            --end-year $(date +%Y)

      - name: Fetch latest ONS weekly sex × age-band data
        run: |
          ons-mortality fetch-weekly-sex-ages \
            --start-year 2010 \
            --end-year $(date +%Y)

      - name: Re-execute notebook 01 (counterfactual mortality)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/01_counterfactual_mortality.ipynb

      - name: Re-execute notebook 07 (live forecast)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/07_live_forecast.ipynb

      - name: Re-execute notebook 08 (age-band excess)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/08_age_band_excess.ipynb

      - name: Re-execute notebook 09 (sex × age excess)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/09_sex_age_excess.ipynb

      - name: Re-execute notebook 10 (backtest calibration)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/10_backtest_calibration.ipynb

      - name: Re-execute notebook 11 (trend specification)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/11_trend_specification.ipynb

      - name: Fetch latest ONS Series DR cause-by-sex-age data
        run: |
          ons-mortality fetch-cause-by-sex-age

      - name: Re-execute notebook 12 (cause decomposition)
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/12_cause_decomposition.ipynb

      - name: Re-render the README figures
        run: |
          python scripts/render_readme_figures.py

      - name: Commit refreshed artefacts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/england_wales_monthly_deaths.csv \
            data/processed/england_wales_weekly_age_deaths.csv \
            data/processed/england_wales_weekly_sex_age_deaths.csv \
            data/processed/england_wales_cause_by_sex_age.csv \
            figures/ \
            notebooks/01_counterfactual_mortality.ipynb \
            notebooks/07_live_forecast.ipynb \
            notebooks/08_age_band_excess.ipynb \
            notebooks/09_sex_age_excess.ipynb \
            notebooks/10_backtest_calibration.ipynb \
            notebooks/11_trend_specification.ipynb \
            notebooks/12_cause_decomposition.ipynb

          if git diff --staged --quiet; then
            echo "No changes from this refresh."
            exit 0
          fi

          git commit -m "Refresh live forecast (auto, $(date -u +%Y-%m-%d))"
          git push
