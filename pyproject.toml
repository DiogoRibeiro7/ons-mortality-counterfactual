[tool.poetry]
name = "ons-mortality-counterfactual"
version = "0.1.0"
description = "Download ONS monthly mortality data into MySQL and build a Bayesian counterfactual chart."
authors = ["Diogo Ribeiro"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ons_mortality", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
beautifulsoup4 = "^4.12.3"
# >=46 closes 4 CVEs flagged in 42.x (DNS-name constraint, OpenSSL bundled
# wheels, subgroup-validation). Permitting 47.x keeps Dependabot quiet on
# its next bump cycle.
cryptography = ">=46.0.0,<48.0.0"
matplotlib = "^3.8.0"
numpy = "^1.26.0"
openpyxl = "^3.1.5"
pandas = "^2.2.0"
pymysql = "^1.1.1"
python-dotenv = "^1.0.1"
# >=2.33 closes the .netrc-leak and zip-extract CVEs in 2.32.x.
requests = "^2.33.0"
sqlalchemy = "^2.0.30"
statsmodels = "^0.14"
xlrd = "^2.0.1"

[tool.poetry.group.dev.dependencies]
# >=9.0.3 closes the tmpdir handling vuln (GHSA-6w46-j5rx-g56g) in 8.x.
pytest = ">=9.0.3,<10"
ruff = "^0.5.0"
mypy = "^1.10.0"
pandas-stubs = "^2.2.2.240603"
types-requests = "^2.32.0.20240712"

[tool.poetry.scripts]
ons-mortality = "ons_mortality.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# `X_train` / `X_all` are the conventional names for design matrices.
"src/ons_mortality/counterfactual.py" = ["N806"]
# Notebooks are exploratory: late imports for display libs are common,
# the cell-by-cell import block ordering is the editor's call, and
# the `X_train` / `X_all` design-matrix convention is preserved.
"notebooks/*.ipynb" = ["I001", "E501", "E402", "F401", "N806"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["bs4.*", "matplotlib.*", "xlrd.*", "openpyxl.*"]
ignore_missing_imports = true
